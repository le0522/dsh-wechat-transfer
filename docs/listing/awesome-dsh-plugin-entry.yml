name: <GITHUB_OWNER>/dsh-wechat-transfer
category: tools
description:
  en: Sends local files to a WeChat chat through the WeChat 4.x Windows desktop app, from a left-sidebar panel, a wechat_send_file tool, or a send button on DSH deliverable cards, verifying the open chat with Windows OCR before attaching anything.
  zh: 在 DSH 侧边栏面板、wechat_send_file 工具或产物卡片的「发微信」按钮上，把本地文件通过 Windows 微信 4.x 桌面端发到指定聊天；附加文件前用 Windows OCR 校验当前聊天。
